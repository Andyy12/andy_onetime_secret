# Sirve index.html para CUALQUIER ruta: Traefik pide /{status}.html, /, etc.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header X-Pagina-Caida "1" always;
  add_header X-Robots-Tag "noindex" always;

  location / {
    try_files /index.html =404;
  }
}
